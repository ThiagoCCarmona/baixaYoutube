name: Release

# Publica uma versão: dispare criando uma tag (git tag v0.5.0 && git push origin v0.5.0)
# ou deixe o workflow "Atualiza yt-dlp" chamar este automaticamente.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Instalar dependências
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -r requirements-build.txt
          python -m pip install -e . --no-deps

      - name: Conferir tag x versão do código
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $versao = python scripts/versao.py atual
          if ("v$versao" -ne $env:TAG) { throw "A tag $env:TAG não bate com a versão do código ($versao)" }
          "VERSAO=$versao" >> $env:GITHUB_ENV

      - name: Testes
        run: python -m pytest -q

      - name: Instalar Inno Setup
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Gerar executável e instalador
        run: .\build.ps1

      - name: Verificar o executável (offline)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $p = Start-Process dist\BaixaYoutube\BaixaYoutube.exe -ArgumentList "--verificar", "verificar.txt" -Wait -PassThru
          Get-Content verificar.txt
          if ($p.ExitCode -ne 0) { throw "Verificação do executável falhou" }

      # O YouTube costuma bloquear IPs de datacenter: esta etapa é informativa.
      # A validação que protege os usuários roda no próprio app, na máquina de cada um.
      - name: Autoteste com download real (informativo)
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $p = Start-Process dist\BaixaYoutube\BaixaYoutube.exe -ArgumentList "--autoteste", "autoteste" -Wait -PassThru
          Get-Content autoteste\autoteste.txt
          if ($p.ExitCode -ne 0) { throw "Autoteste falhou" }

      - name: Gerar SHA256SUMS.txt
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $nome = "BaixaYoutube-Setup-$env:VERSAO.exe"
          $hash = (Get-FileHash "dist\$nome" -Algorithm SHA256).Hash.ToLower()
          "$hash  $nome" | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          gh release create $env:TAG "dist\BaixaYoutube-Setup-$env:VERSAO.exe" SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --title "BaixaYoutube $env:VERSAO" --generate-notes --verify-tag
